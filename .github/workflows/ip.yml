name: FOFA IP

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:          # 手动触发

# 从系统顶层为自动化容器开启写入权限
permissions:
  contents: write

jobs:
  fetch-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # 在更新和安装 ffmpeg 前清除缓存并强制同步包索引
      - name: Install ffmpeg
        run: |
          sudo apt-get clean
          sudo apt-get update --fix-missing
          sudo apt-get install -y ffmpeg

      - name: Run fofa_fetch.py
        run: python fofa_fetch.py

      # 修复：修正邮箱格式，并简化为原生安全的本地 Git 推送
      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@://github.com"
          git add 计数.txt
          git add ip/*.txt || true
          git add IPTV.txt || true
          
          if ! git diff --staged --quiet; then
            git commit -m "自动更新：计数、IP文件、IPTV.txt"
            # 使用原生的 origin 远程库安全推送，无需手动拼接 URL
            git push origin HEAD:main
          else
            echo "⚠️ 无需提交"
          fi
